services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=phytosynergy_db
      - POSTGRES_USER=postgres
      # Read from .env (gitignored). See .env.example / SECRETS_ROTATION.md.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - create .env from .env.example}
    restart: always

  web:
    build: .
    volumes:
      - static_volume:/app/staticfiles
    expose:
      - 8000
    depends_on:
      - db
    environment:
      # Secrets come from .env (gitignored). The :? form makes Compose fail
      # loudly with this message instead of silently substituting an empty
      # string. See .env.example / SECRETS_ROTATION.md.
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - create .env from .env.example}@db:5432/phytosynergy_db
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is not set - create .env from .env.example}
      - DEBUG=0
      - ALLOWED_HOSTS=phytosynergydb.in,www.phytosynergydb.in,192.168.1.35,localhost,127.0.0.1
      - CSRF_TRUSTED_ORIGINS=https://phytosynergydb.in,https://www.phytosynergydb.in
      - SECURE_HSTS_SECONDS=31536000
      - SECURE_HSTS_INCLUDE_SUBDOMAINS=1
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web
    restart: always

  tunnel:
    image: cloudflare/cloudflared:latest
    # Run as root so it can read the host credentials JSON (mode 0400,
    # owned by mmilab) without weakening the secret's permissions.
    user: root
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      # Tunnel config (committed, no secrets) and the credentials JSON
      # (mounted from the host, never committed).
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      - /home/mmilab/.cloudflared/38203e22-6472-4cbf-9e33-fad6e510d7d0.json:/etc/cloudflared/38203e22-6472-4cbf-9e33-fad6e510d7d0.json:ro
    depends_on:
      - nginx
    restart: always

volumes:
  postgres_data:
  static_volume: