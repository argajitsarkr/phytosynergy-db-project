upstream web_server {
    server web:8000;
}

# Use the tunnel's X-Forwarded-Proto when present, otherwise fall back to the
# scheme nginx itself saw. Prevents an empty header from confusing Django's
# SECURE_PROXY_SSL_HEADER detection.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Resolve the REAL client IP for rate limiting.
# CRITICAL: every request arrives via cloudflared, so $remote_addr is always the
# tunnel container's address. Keying a limit_req zone on $remote_addr (or
# $binary_remote_addr) would treat the entire internet as ONE client and
# throttle all visitors together. cloudflared sets CF-Connecting-IP; fall back
# to X-Forwarded-For, then to $remote_addr for direct LAN access.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $http_x_forwarded_for;
}
map $client_ip $limit_key {
    default $client_ip;
    ""      $remote_addr;
}

# Rate-limit zones. 10m holds roughly 160k distinct addresses.
#   login - brute-force defence, works with django-axes (which locks the
#           account); this limits how fast attempts can even be made.
#   api   - the public JSON API is unauthenticated and paginated, so it is
#           cheap to scrape and cheap to overload 3 gunicorn workers with.
limit_req_zone $limit_key zone=login_zone:10m rate=10r/m;
limit_req_zone $limit_key zone=api_zone:10m rate=60r/m;
limit_req_status 429;

server {
    listen 80;
    server_name phytosynergydb.in www.phytosynergydb.in 192.168.1.35 localhost;

    client_max_body_size 50M;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    # --- Security headers ---
    # Note: HSTS is intentionally NOT set here. It is controlled by Django
    # (SECURE_HSTS_SECONDS) so it can be enabled only on a dedicated domain.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Hide the nginx version in the Server header.
    server_tokens off;

    # --- Rate-limited paths ---
    # These must come BEFORE `location /`, and each has to repeat the proxy
    # headers because a matched prefix location does not inherit from `/`.

    # Login endpoints. burst=5 nodelay allows a few quick retries (a fat-
    # fingered password) but caps sustained guessing at 10/min per client.
    location /accounts/login/ {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://web_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /admin/ {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://web_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Public JSON API. 60r/m with a burst of 20 leaves normal interactive use
    # untouched while making bulk scraping slow and expensive.
    location /api/v1/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://web_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://web_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the original scheme reported by the tunnel (ngrok/Cloudflare
        # set X-Forwarded-Proto=https); fall back to nginx's own scheme.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }
}
